<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>江戸文化クイズ（タップ版）</title>

<style>
  body {
    font-size: 16px;
    padding: 10px;
    line-height: 1.6;
  }

  /* 横3列レイアウト */
  .row {
    display: flex;
    flex-direction: row;
    gap: 10px;
    margin-bottom: 20px;
  }

  .box {
    flex: 1;
    border: 2px solid #ccc;
    padding: 10px;
    border-radius: 8px;
    min-height: 80px;
  }

  .title {
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 8px;
  }

  .item {
    background: #f0f0f0;
    padding: 8px;
    margin: 6px 0;
    border-radius: 6px;
    font-size: 16px;
  }

  .item:hover {
    background: #e0e0ff;
  }

  .selected {
    border-color: #66f !important;
  }

  .choices {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .result {
    font-size: 20px;
    font-weight: bold;
    margin-top: 20px;
  }
</style>

</head>
<body>

<h1>江戸文化クイズ（タップ版）</h1>

<!-- 横3列レイアウト -->
<div class="row">
  <div id="eventsBox" class="box" data-value="">
    <div class="title">作品名</div>
  </div>

  <div id="personsBox" class="box" data-value="">
    <div class="title">作者</div>
  </div>

  <div id="timesBox" class="box" data-value="">
    <div class="title">時期</div>
  </div>
</div>

<h2>選択肢</h2>
<div id="choices" class="choices"></div>

<div id="result" class="result"></div>

<script>
const data = [
  { event: "東海道中膝栗毛", person: "十返舎一九", time: "化政文化" },
  { event: "南総里見八犬伝", person: "曲亭馬琴", time: "化政文化" },
  { event: "雨月物語", person: "上田秋成", time: "化政文化" },
  { event: "春色梅児誉美", person: "為永春水", time: "化政文化" },
  { event: "東海道四谷怪談", person: "鶴屋南北", time: "化政文化" },
  { event: "蔦屋重三郎の出版文化", person: "蔦屋重三郎", time: "化政文化" },
  { event: "見返り美人図", person: "菱川師宣", time: "元禄文化" },
  { event: "曽根崎心中", person: "近松門左衛門", time: "元禄文化" },
  { event: "奥の細道", person: "松尾芭蕉", time: "元禄文化" },
  { event: "大日本史編纂", person: "水戸光圀", time: "元禄文化" }
];

let selectedBox = null;

function enableTapSelect(box, type) {
  box.addEventListener("click", () => {
    if (selectedBox) selectedBox.box.classList.remove("selected");
    selectedBox = { box, type };
    box.classList.add("selected");
  });
}

function makeTappable(item, type, value) {
  item.addEventListener("click", () => {
    if (!selectedBox) return;
    if (selectedBox.type !== type) return;

    selectedBox.box.dataset.value = value;
    selectedBox.box.innerHTML =
      `<div class="title">${selectedBox.box.querySelector(".title").textContent}</div>
       <div class="item">${value}</div>`;

    selectedBox.box.classList.remove("selected");
    selectedBox = null;

    checkAnswer();
  });
}

function checkAnswer() {
  const e = document.getElementById("eventsBox").dataset.value;
  const p = document.getElementById("personsBox").dataset.value;
  const t = document.getElementById("timesBox").dataset.value;

  if (!e || !p || !t) return;

  const correct = data.find(d => d.event === e);

  if (correct.person === p && correct.time === t) {
    document.getElementById("result").textContent = "正解！";
  } else {
    document.getElementById("result").textContent = "不正解…";
  }
}

function init() {
  const choices = document.getElementById("choices");

  data.forEach(d => {
    const e = document.createElement("div");
    e.className = "item";
    e.textContent = d.event;
    makeTappable(e, "event", d.event);
    choices.appendChild(e);

    const p = document.createElement("div");
    p.className = "item";
    p.textContent = d.person;
    makeTappable(p, "person", d.person);
    choices.appendChild(p);

    const t = document.createElement("div");
    t.className = "item";
    t.textContent = d.time;
    makeTappable(t, "time", d.time);
    choices.appendChild(t);
  });

  enableTapSelect(document.getElementById("eventsBox"), "event");
  enableTapSelect(document.getElementById("personsBox"), "person");
  enableTapSelect(document.getElementById("timesBox"), "time");
}

init();
</script>

</body>
</html>
