<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>江戸文化クイズ（タップ版）</title>

<style>
  body { font-family: sans-serif; padding: 20px; }

  /* 上段：横3列 */
  .top-row {
    display: flex;
    gap: 30px;
    margin-bottom: 30px;
  }

  .box {
    border: 2px solid #ccc;
    padding: 10px;
    width: 200px;
    min-height: 80px;
    text-align: center;
  }

  .title {
    font-weight: bold;
    margin-bottom: 10px;
  }

  /* 下段：横3列 */
  .bottom-row {
    display: flex;
    gap: 30px;
  }

  .choices {
    width: 200px;
  }

  .item {
    padding: 8px;
    margin: 5px 0;
    background: #eef;
    border: 1px solid #99c;
    cursor: pointer;
    text-align: center;
  }

  .wrong {
    border-color: red !important;
    background: #fdd !important;
  }

  .correct {
    border-color: green !important;
    background: #d6ffd6 !important;
  }

  #result {
    margin-top: 20px;
    font-size: 20px;
    font-weight: bold;
  }

  .add-area {
    margin-bottom: 20px;
  }

  .selected-box {
    border-color: #66f !important;
  }
</style>
</head>
<body>

<h2>江戸文化クイズ（タップ版）</h2>

<!-- ▼ 追加フォーム -->
<div class="add-area">
  <h3>選択肢を追加する</h3>
  作品名：<input id="addEvent">
  作者：<input id="addPerson">
  時期：<input id="addTime">
  <button onclick="addChoice()">追加</button>
</div>

<!-- ▼ 上段：箱 -->
<div class="top-row">
  <div class="box" id="eventsBox"><div class="title">作品名</div></div>
  <div class="box" id="personsBox"><div class="title">作者</div></div>
  <div class="box" id="timesBox"><div class="title">時期</div></div>
</div>

<!-- ▼ 下段：選択肢 -->
<div class="bottom-row">
  <div class="choices" id="eventsChoices"></div>
  <div class="choices" id="personsChoices"></div>
  <div class="choices" id="timesChoices"></div>
</div>

<div id="result"></div>

<script>
// ▼ 江戸文化クイズのデータ
let data = [
  { event: "東海道中膝栗毛", person: "十返舎一九", time: "化政文化" },
  { event: "南総里見八犬伝", person: "曲亭馬琴", time: "化政文化" },
  { event: "雨月物語", person: "上田秋成", time: "化政文化" },
  { event: "春色梅児誉美", person: "為永春水", time: "化政文化" },
  { event: "東海道四谷怪談", person: "鶴屋南北", time: "化政文化" },
  { event: "蔦屋重三郎の出版文化", person: "蔦屋重三郎", time: "化政文化" },
  { event: "見返り美人図", person: "菱川師宣", time: "元禄文化" },
  { event: "曽根崎心中", person: "近松門左衛門", time: "元禄文化" },
  { event: "奥の細道", person: "松尾芭蕉", time: "元禄文化" },
  { event: "大日本史編纂", person: "水戸光圀", time: "元禄文化" }
];

// ▼ 選択肢（内部データ）
let eventChoices = data.map(d => d.event);
let personChoices = [...new Set(data.map(d => d.person))];
let timeChoices = [...new Set(data.map(d => d.time))];

let selectedBox = null;

// ▼ 箱タップ選択
function enableTapSelect(box, type) {
  box.addEventListener("click", () => {
    if (selectedBox) selectedBox.classList.remove("selected-box");
    selectedBox = box;
    selectedBox.dataset.type = type;
    selectedBox.classList.add("selected-box");
  });
}

// ▼ 選択肢タップ
function makeTappable(item, type, value) {
  item.addEventListener("click", () => {
    if (!selectedBox) return;
    if (selectedBox.dataset.type !== type) return;

    selectedBox.dataset.value = value;
    selectedBox.innerHTML =
      `<div class="title">${selectedBox.querySelector(".title").textContent}</div>
       <div class="item">${value}</div>`;

    selectedBox.classList.remove("selected-box");
    selectedBox = null;

    checkAnswer();
  });
}

// ▼ ○○Bの残り○○A数
function countRemainingWorks(person) {
  return eventChoices.filter(event => {
    const d = data.find(x => x.event === event);
    return d && d.person === person;
  }).length;
}

// ▼ 正解判定
function checkAnswer() {
  const e = eventsBox.dataset.value;
  const p = personsBox.dataset.value;
  const t = timesBox.dataset.value;

  if (!e || !p || !t) return;

  const ok = data.find(d => d.event === e && d.person === p && d.time === t);

  if (ok) {
    result.textContent = "正解！";

    eventsBox.classList.add("correct");
    personsBox.classList.add("correct");
    timesBox.classList.add("correct");

    removeChoice(eventsChoicesDiv, e);

    const remaining = countRemainingWorks(p);

    if (remaining === 0) {
      removeChoice(personsChoicesDiv, p);
    } else {
      const exists = [...personsChoicesDiv.children].some(item => item.textContent === p);
      if (!exists) {
        const item = document.createElement("div");
        item.className = "item";
        item.textContent = p;
        makeTappable(item, "person", p);
        personsChoicesDiv.appendChild(item);
      }
    }

    setTimeout(() => {
      resetBoxes();
      result.textContent = "";
    }, 1200);

    checkClear();
  } else {
    result.textContent = "不正解";

    eventsBox.classList.add("wrong");
    personsBox.classList.add("wrong");
    timesBox.classList.add("wrong");

    setTimeout(() => {
      resetBoxes();
      result.textContent = "";
    }, 1200);
  }
}

// ▼ クリア判定
function checkClear() {
  const noEvents = eventsChoicesDiv.children.length === 0;
  const noPersons = personsChoicesDiv.children.length === 0;

  if (noEvents && noPersons) {
    result.textContent = "クリア！";

    setTimeout(() => {
      eventChoices = data.map(d => d.event);
      personChoices = [...new Set(data.map(d => d.person))];
      timeChoices = [...new Set(data.map(d => d.time))];

      init();
      result.textContent = "";
    }, 1500);
  }
}

// ▼ 選択肢削除
function removeChoice(column, value) {
  [...column.children].forEach(item => {
    if (item.textContent === value) item.remove();
  });

  eventChoices = eventChoices.filter(ev => ev !== value);

  personChoices = [...new Set(
    eventChoices.map(ev => {
      const d = data.find(x => x.event === ev);
      return d ? d.person : null;
    })
  )];
}

// ▼ 箱リセット
function resetBoxes() {
  ["eventsBox", "personsBox", "timesBox"].forEach(id => {
    const box = document.getElementById(id);
    box.dataset.value = "";
    box.classList.remove("wrong");
    box.classList.remove("correct");
    box.innerHTML = `<div class="title">${box.querySelector(".title").textContent}</div>`;
  });
}

// ▼ 選択肢追加
function addChoice() {
  const e = document.getElementById("addEvent").value;
  const p = document.getElementById("addPerson").value;
  const t = document.getElementById("addTime").value;

  if (!e || !p || !t) {
    alert("3つすべて入力してください");
    return;
  }

  data.push({ event: e, person: p, time: t });

  eventChoices.push(e);
  personChoices.push(p);
  timeChoices.push(t);

  init();
}

// ▼ 初期化
function init() {
  resetBoxes();

  eventsChoicesDiv.innerHTML = "";
  personsChoicesDiv.innerHTML = "";
  timesChoicesDiv.innerHTML = "";

  eventChoices.forEach(e => {
    const item = document.createElement("div");
    item.className = "item";
    item.textContent = e;
    makeTappable(item, "event", e);
    eventsChoicesDiv.appendChild(item);
  });

  [...new Set(personChoices)].forEach(p => {
    const item = document.createElement("div");
    item.className = "item";
    item.textContent = p;
    makeTappable(item, "person", p);
    personsChoicesDiv.appendChild(item);
  });

  timeChoices.forEach(t => {
    const item = document.createElement("div");
    item.className = "item";
    item.textContent = t;
    makeTappable(item, "time", t);
    timesChoicesDiv.appendChild(item);
  });

  enableTapSelect(eventsBox, "event");
  enableTapSelect(personsBox, "person");
  enableTapSelect(timesBox, "time");
}

init();
</script>

</body>
</html>
